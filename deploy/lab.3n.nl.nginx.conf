# nginx server block voor lab.3n.nl
# Statische site — serveert de inhoud van /lab uit deze repo.
#
# Plaats dit bestand in /etc/nginx/sites-available/lab.3n.nl.conf
# en symlink naar sites-enabled:
#   sudo ln -s /etc/nginx/sites-available/lab.3n.nl.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS wordt hieronder aangenomen via certbot (zie DEPLOY.md, stap 4).

server {
    listen 80;
    listen [::]:80;
    server_name lab.3n.nl;

    # Certbot plaatst hier zijn ACME-challenge; de rest stuurt door naar https.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lab.3n.nl;

    # Pas dit pad aan naar waar je de repo hebt gecloned:
    root /var/www/lab.3n.nl/lab;
    index index.html;

    # --- TLS (certbot vult deze paden zelf in bij `certbot --nginx`) ---
    ssl_certificate     /etc/letsencrypt/live/lab.3n.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lab.3n.nl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # --- Security headers ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Statische assets langer cachen (de HTML zelf niet, zodat updates direct zichtbaar zijn).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    access_log /var/log/nginx/lab.3n.nl.access.log;
    error_log  /var/log/nginx/lab.3n.nl.error.log;
}
